# Local development: Postgres + the app. Run:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mcts
      # Strong password supplied via the gitignored .env file (see .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mcts
    # Not published to the host: the app reaches Postgres over the internal compose
    # network. (Host port 5432 is already used by another service on this box.)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcts"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # All secrets come from the gitignored .env file (compose substitutes them here).
      DATABASE_URL: postgres://mcts:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/mcts
      PGSSL: "false"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SEED_DEMO: "true"
      PORT: "3000"
    # Bound to localhost only; nginx (host) reverse-proxies mcts.urbanwerkzsg.com here.
    # Host port 3010 chosen because 3000 is taken by another service on this box.
    ports:
      - "127.0.0.1:3010:3000"
    command: sh -c "node src/migrate.js && node src/server.js"

volumes:
  pgdata:
