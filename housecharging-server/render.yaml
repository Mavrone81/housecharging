# One-click-ish deploy on Render. In Render: New + → Blueprint → point at this repo.
# Render reads this file, creates a Postgres DB and a web service, and links them.
services:
  - type: web
    name: housecharging
    runtime: node
    plan: free
    buildCommand: npm install
    # Run migrations on every deploy (idempotent), then start the server.
    startCommand: node src/migrate.js && node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: housecharging-db
          property: connectionString
      - key: PGSSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false        # set this yourself in the Render dashboard
      - key: SEED_DEMO
        value: "false"

databases:
  - name: housecharging-db
    plan: free
