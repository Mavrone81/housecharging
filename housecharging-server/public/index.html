<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCTS · Community Utility Billing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f7; --bg2:#e6ecf4;
    --panel:#ffffff; --panel-2:#f7f9fc;
    --ink:#101828; --ink-2:#475467; --muted:#98a2b3; --line:#e7ebf1;
    --brand:#0f766e; --brand-2:#14b8a6; --brand-d:#0b5650; --brand-soft:#e7f6f4;
    --water:#0ea5e9; --water-soft:#e6f5fd; --gas:#f97316; --gas-soft:#fff1e6;
    --ok:#16a34a; --ok-soft:#e9f8ef; --warn:#d97706; --warn-soft:#fef5e7; --bad:#dc2626; --bad-soft:#fdecec;
    --r:16px; --r-sm:11px;
    --sh-sm:0 1px 2px rgba(16,24,40,.06); --sh:0 4px 18px rgba(16,24,40,.07); --sh-lg:0 20px 50px rgba(16,24,40,.14);
    --grad:linear-gradient(140deg,#0f766e 0%,#14b8a6 55%,#0ea5e9 130%);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Inter","Noto Sans Thai","Noto Sans SC",system-ui,sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%,#dff3f0 0%,transparent 60%),var(--bg);
    color:var(--ink);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
  :lang(th){font-family:"Noto Sans Thai","Inter",sans-serif}
  :lang(zh){font-family:"Noto Sans SC","Inter",sans-serif}
  a{color:var(--brand);text-decoration:none}
  button{font-family:inherit}
  svg{display:block}
  .icn{width:20px;height:20px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .icn.sm{width:16px;height:16px}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;border:none;
    padding:11px 18px;border-radius:11px;cursor:pointer;font-size:14px;font-weight:600;transition:.15s;box-shadow:var(--sh-sm)}
  .btn:hover{background:var(--brand-d);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.block{width:100%;justify-content:center;padding:13px}
  .btn.sm{padding:7px 13px;font-size:13px;border-radius:9px}
  .btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--line);box-shadow:none}
  .btn.ghost:hover{background:var(--brand-soft);border-color:var(--brand-2);transform:none}
  .btn.soft{background:var(--brand-soft);color:var(--brand-d);box-shadow:none}
  .btn.soft:hover{background:#d6efec;transform:none}
  .btn.ok{background:var(--ok)} .btn.ok:hover{filter:brightness(.94)}
  .btn.danger{background:#fff;color:var(--bad);border:1px solid #f3c9c9;box-shadow:none}
  .btn.danger:hover{background:var(--bad-soft);transform:none}

  /* ---------- inputs ---------- */
  .field{margin-bottom:14px}
  label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:6px;font-weight:600}
  .opt{color:var(--muted);font-weight:500}
  input,select{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;font-size:14px;
    background:#fff;color:var(--ink);font-family:inherit;transition:.15s}
  input:focus,select:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 4px var(--brand-soft)}
  input[type=checkbox]{width:17px;height:17px;min-width:17px;padding:0;accent-color:var(--brand);cursor:pointer;vertical-align:middle}
  .colcheck{width:40px;text-align:center}
  .help{font-size:12px;color:var(--muted);margin-top:6px}

  /* ---------- language pills ---------- */
  .lang{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
  .lang button{background:transparent;border:none;padding:6px 11px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .lang button.active{background:#fff;color:var(--brand-d);box-shadow:var(--sh-sm)}

  /* ---------- cards ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:24px}
  .card + .card{margin-top:18px}
  h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
  h2{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:0 0 4px}
  h3{font-size:14px;font-weight:700;margin:0 0 10px;color:var(--ink)}
  .sub{color:var(--ink-2);font-size:13.5px;margin:0 0 18px}
  .muted{color:var(--muted)} .small{font-size:12.5px}

  /* ---------- notices ---------- */
  .notice{display:flex;gap:9px;align-items:flex-start;padding:12px 14px;border-radius:11px;font-size:13.5px;margin-top:12px;font-weight:500}
  .notice.ok{background:var(--ok-soft);color:#0c6b34;border:1px solid #bbe9cb}
  .notice.err{background:var(--bad-soft);color:#a01919;border:1px solid #f3c9c9}
  .notice.info{background:var(--water-soft);color:#0a5a86;border:1px solid #bfe6f8}

  /* ---------- tables ---------- */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:13px}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:520px}
  thead th{background:var(--panel-2);color:var(--ink-2);font-size:11px;font-weight:700;text-transform:uppercase;
    letter-spacing:.05em;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--line)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#fafbfd}
  .right{text-align:right} .nowrap{white-space:nowrap}
  tfoot td{padding:12px 14px;background:var(--panel-2);font-weight:700}

  /* ---------- pills ---------- */
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:700}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill.pending{background:var(--warn-soft);color:#b45309}
  .pill.approved{background:var(--ok-soft);color:#15803d}
  .pill.rejected{background:var(--bad-soft);color:#b91c1c}
  .pill.warn{background:var(--bad-soft);color:#b91c1c}
  .own-row.paid{background:var(--brand-soft)}
  .own-row.paid td,.own-row.paid strong{color:var(--brand-d)}
  .own-row.paid.active{box-shadow:inset 3px 0 0 var(--brand)}
  .pill.warn::before{display:none}

  /* ---------- stats ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;position:relative;overflow:hidden}
  .stat .ico{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;margin-bottom:12px}
  .stat .l{font-size:12px;color:var(--ink-2);font-weight:600}
  .stat .v{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
  .ico.brand{background:var(--brand-soft);color:var(--brand)} .ico.water{background:var(--water-soft);color:var(--water)}
  .ico.gas{background:var(--gas-soft);color:var(--gas)} .ico.ok{background:var(--ok-soft);color:var(--ok)}
  .ico.warn{background:var(--warn-soft);color:var(--warn)}

  /* ---------- segmented ---------- */
  .seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:4px;gap:3px;flex-wrap:wrap}
  .seg button{background:transparent;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink-2)}
  .seg button.active{background:#fff;color:var(--brand-d);box-shadow:var(--sh-sm)}

  .rowflex{display:flex;gap:14px;flex-wrap:wrap}
  .rowflex > *{flex:1;min-width:150px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:540px){.grid2{grid-template-columns:1fr}}

  /* ================= LOGIN ================= */
  .auth{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}
  .auth-hero{background:var(--grad);color:#fff;padding:54px 50px;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .auth-hero .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.25}
  .auth-hero .b1{width:340px;height:340px;background:#fff;top:-120px;right:-90px;opacity:.12}
  .auth-hero .b2{width:260px;height:260px;background:#0ea5e9;bottom:-110px;left:-60px;opacity:.3}
  .hero-brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:19px;position:relative;z-index:1}
  .hero-logo{width:44px;height:44px;border-radius:12px;overflow:hidden;display:grid;place-items:center;line-height:0}
  .hero-logo svg,.hero-logo img{width:100%;height:100%;object-fit:contain;display:block}
  .hero-art{flex:1;display:grid;place-items:center;position:relative;z-index:1;min-height:0;padding:24px 0}
  .hero-logo-wrap{width:168px;height:168px;border-radius:30px;background:rgba(255,255,255,.13);
    border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px);display:grid;place-items:center;
    box-shadow:0 24px 60px rgba(0,0,0,.20);padding:16px}
  .hero-logo-img{max-width:100%;max-height:100%;object-fit:contain;border-radius:14px}
  .hero-default-logo{width:160px;height:160px;filter:drop-shadow(0 24px 55px rgba(0,0,0,.30))}
  .hero-default-logo svg{width:100%;height:100%}
  .hero-mid{position:relative;z-index:1}
  .hero-mid h2{font-size:30px;font-weight:800;line-height:1.2;letter-spacing:-.02em;color:#fff;margin-bottom:14px;max-width:15ch}
  .hero-mid p{font-size:15px;opacity:.9;max-width:34ch;margin:0}
  .hero-feats{display:flex;flex-direction:column;gap:12px;margin-top:30px;position:relative;z-index:1}
  .hero-feat{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500}
  .hero-feat .fi{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
  .auth-form{display:flex;align-items:center;justify-content:center;padding:40px 30px}
  .auth-card{width:100%;max-width:380px}
  .auth-card .top{display:flex;justify-content:flex-end;margin-bottom:26px}
  .role-pick{display:flex;flex-direction:column;gap:14px;margin-top:22px}
  .role-btn{display:flex;align-items:center;gap:15px;text-align:left;background:#fff;border:1px solid var(--line);
    border-radius:15px;padding:17px 18px;cursor:pointer;transition:.15s;box-shadow:var(--sh-sm)}
  .role-btn:hover{border-color:var(--brand-2);box-shadow:var(--sh);transform:translateY(-2px)}
  .role-btn .ri{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}
  .role-btn .rt{font-weight:700;font-size:15px}
  .role-btn .rd{font-size:12.5px;color:var(--ink-2);margin-top:2px}
  .role-btn .arr{margin-left:auto;color:var(--muted)}
  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px;font-weight:600;cursor:pointer;background:none;border:none;padding:0;margin-bottom:18px}
  .backlink:hover{color:var(--brand)}
  .demo-tag{margin-top:18px;padding:10px 13px;background:var(--panel-2);border:1px dashed var(--line);border-radius:10px;font-size:12.5px;color:var(--ink-2)}
  @media(max-width:860px){.auth{grid-template-columns:1fr}.auth-hero{display:none}}

  /* ================= APP SHELL ================= */
  .shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
  .sidebar{background:var(--panel);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .side-brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:16px;padding:6px 8px 18px}
  .side-logo{width:38px;height:38px;border-radius:11px;overflow:hidden;display:grid;place-items:center;line-height:0;flex:none}
  .side-logo svg,.side-logo img{width:100%;height:100%;object-fit:contain;display:block}
  .nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
  .nav-item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:11px;cursor:pointer;
    font-weight:600;font-size:14px;color:var(--ink-2);background:none;border:none;width:100%;text-align:left;transition:.12s}
  .nav-item:hover{background:var(--panel-2);color:var(--ink)}
  .nav-item.active{background:var(--brand-soft);color:var(--brand-d)}
  .nav-item .badge{margin-left:auto;background:var(--gas);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:999px;display:grid;place-items:center}
  .side-foot{margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
  .user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:11px}
  .user-av{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand-d);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
  .user-chip .un{font-weight:600;font-size:13px;line-height:1.2}
  .user-chip .ur{font-size:11.5px;color:var(--muted)}

  .main{display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 28px;
    border-bottom:1px solid var(--line);background:rgba(255,255,255,.7);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5;flex-wrap:wrap}
  .topbar .pg{font-weight:700;font-size:17px}
  .topbar .rt{display:flex;align-items:center;gap:12px}
  .content{padding:26px 28px 60px;max-width:1080px;width:100%}
  /* Owner portal has no sidebar — single full-width column with centered content. */
  .owner-shell{grid-template-columns:1fr}
  .owner-shell .content{margin-inline:auto}
  .owner-shell .topbar{padding-inline:max(28px,calc((100% - 1080px)/2))}

  .mob-top{display:none}
  .mob-nav{display:none}
  @media(max-width:820px){
    .shell{grid-template-columns:1fr}
    .sidebar{display:none}
    .topbar{display:none}
    .mob-top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);gap:10px;position:sticky;top:0;z-index:6}
    /* clean underline tab bar */
    .mob-nav{display:flex;gap:2px;overflow-x:auto;padding:0 8px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);position:sticky;top:57px;z-index:5;scrollbar-width:none}
    .mob-nav::-webkit-scrollbar{display:none}
    .mob-nav button{flex:none;display:inline-flex;align-items:center;gap:7px;padding:14px 12px 11px;border:none;background:none;
      font-weight:600;font-size:13.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap;position:relative;transition:.15s}
    .mob-nav button svg{width:17px;height:17px;opacity:.85}
    .mob-nav button:hover{color:var(--ink)}
    .mob-nav button.active{color:var(--brand)}
    .mob-nav button.active::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--grad)}
    .mob-nav .mdot{width:7px;height:7px;border-radius:50%;background:var(--gas);margin-left:-3px;align-self:flex-start;margin-top:2px}
    .content{padding:22px 16px 56px}
  }

  /* ---------- invoice statement ---------- */
  .invoice{border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh)}
  .inv-head{background:var(--grad);color:#fff;padding:22px 24px;display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px}
  .inv-head .lbl{font-size:12px;opacity:.85;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
  .inv-head .big{font-size:21px;font-weight:800;margin-top:2px}
  .inv-head .tot{font-size:30px;font-weight:800;letter-spacing:-.02em}
  .inv-body{padding:6px 24px 22px}
  .inv-foot-note{padding:14px 24px;background:var(--panel-2);font-size:12.5px;color:var(--ink-2);border-top:1px solid var(--line)}
  .util-cell{display:flex;align-items:center;gap:9px;font-weight:600}
  .util-dot{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
  .search-wrap{position:relative;display:flex;align-items:center}
  .search-wrap > svg{position:absolute;left:13px;color:var(--muted);pointer-events:none}
  .search-wrap input{padding-left:38px}
  .own-row{cursor:pointer}
  .own-row:hover{background:var(--brand-soft)}
  .own-row.active{background:var(--brand-soft)}
  .own-row.active td:first-child{box-shadow:inset 3px 0 0 var(--brand)}
  .formula-vars{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:11px 14px;font-size:12.5px;color:var(--ink-2);line-height:1.7}
  .formula-vars{font-family:ui-monospace,Menlo,Consolas,monospace}
  .fx-row{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#0b1220}
  .fx-eq{display:grid;place-items:center;padding:0 14px;background:#111c30;color:#7dd3fc;font-family:ui-monospace,monospace;font-weight:700}
  .fx-input{border:none;border-radius:0;background:#0b1220;color:#e2f3ff;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;padding:13px 14px}
  .fx-input:focus{outline:none;box-shadow:inset 0 0 0 2px var(--brand-2)}
  .fx-input.bad{color:#fecaca;box-shadow:inset 0 0 0 2px #b91c1c}
  .fx-status{min-height:18px;margin-top:6px;font-size:12.5px}
  .fx-ok{color:var(--ok);font-weight:600;display:inline-flex;align-items:center;gap:5px}
  .fx-err{color:var(--bad);font-weight:600}
  .logo-box{width:104px;height:104px;border-radius:18px;border:1px solid var(--line);background:var(--panel-2);
    display:grid;place-items:center;padding:12px;flex:none}
  .logo-box img,.logo-box svg{display:block}
  .empty{text-align:center;padding:34px 16px;color:var(--muted)}
  .empty .ei{width:52px;height:52px;border-radius:14px;background:var(--panel-2);display:grid;place-items:center;margin:0 auto 12px;color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===================== ICONS ===================== */
const IC={
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/>',
  house:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9.5 21v-6h5v6"/>',
  rates:'<path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h5"/><path d="M15.5 16.5 17 18l2.5-2.5"/>',
  meter:'<circle cx="12" cy="12" r="9"/><path d="M12 12l3.5-3.5"/><path d="M12 3v2M21 12h-2M12 21v-2M3 12h2"/>',
  invoice:'<path d="M6 2h9l4 4v16H6z"/><path d="M14 2v5h5"/><path d="M9 13h6M9 17h6M9 9h2"/>',
  approve:'<path d="M16 11l2 2 4-4"/><circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.5 3-6 7-6"/>',
  water:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',
  gas:'<path d="M12 3c1 3-2 4-2 7a2 2 0 0 0 4 0M8 13a4 4 0 1 0 8 0c0-3-2-4-2-7-3 2-6 4-6 7z"/>',
  logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/>',
  arrow:'<path d="M9 6l6 6-6 6"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.5 2.5 15 0 18M12 3c-2.5 2.5-2.5 15 0 18"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',
  doc:'<path d="M6 2h9l4 4v16H6z"/><path d="M14 2v5h5"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',

async function api(path, { method='GET', body, auth=true } = {}){
  const headers = { 'Content-Type':'application/json' };
  if(auth && session && session.token) headers['Authorization']='Bearer '+session.token;
  const res = await fetch(path, { method, headers, body: body!==undefined?JSON.stringify(body):undefined });
  let data=null; try{ data=await res.json(); }catch(e){}
  if(!res.ok){ const err=new Error((data&&data.error)||('HTTP '+res.status)); err.status=res.status; err.data=data; throw err; }
  return data;
}

// Client cache shaped like the original db (so all render code works unchanged).
let db = {
  settings:{logo:null, communityName:'MCTS', address:'', promptPayQr:null},
  rates:{currency:'THB', waterRate:18, waterFixed:30, gasRate:25, gasFixed:20, garbageFee:0, serviceFee:0},
  formula:{water:DEFAULT_FORMULA, gas:DEFAULT_FORMULA},
  houses:[], readings:[], owners:[], stateVersion:0,
};
// Per-house fee override: null = inherit the community default.
const normHouse = h => ({ id:String(h.id), cluster:h.cluster||'', houseNumber:h.house_number, ownerName:h.owner_name||'',
  garbageFee:(h.garbage_fee==null?null:Number(h.garbage_fee)), serviceFee:(h.service_fee==null?null:Number(h.service_fee)) });
const normReading = r => ({ id:String(r.id), houseId:String(r.house_id), period:r.period,
  waterPrev:Number(r.water_prev), waterCurr:Number(r.water_curr), gasPrev:Number(r.gas_prev), gasCurr:Number(r.gas_curr),
  waterNo:r.waterNo, gasNo:r.gasNo, paid:!!r.paid, paidAt:r.paid_at||null, hasProof:!!r.hasProof });
const normOwner = o => ({ id:String(o.id), username:o.username, houseNumber:o.house_number, status:o.status });
function applySettings(s){
  db.stateVersion=Number(s.state_version)||0;
  db.settings={ logo:s.logo||null, communityName:s.community_name||'MCTS', address:s.address||'', promptPayQr:s.promptpay_qr||null,
    maxLoginAttempts:Number(s.max_login_attempts)||5, lockoutMinutes:Number(s.login_lockout_minutes)||15 };
  db.rates={ currency:s.currency||'THB', waterRate:Number(s.water_rate), waterFixed:Number(s.water_fixed), gasRate:Number(s.gas_rate), gasFixed:Number(s.gas_fixed), garbageFee:Number(s.garbage_fee)||0, serviceFee:Number(s.service_fee)||0 };
  db.formula={ water:s.formula_water||DEFAULT_FORMULA, gas:s.formula_gas||DEFAULT_FORMULA };
}

// Whole-state persistence (admin only): houses + readings + settings/rates/formula.
let _saveTimer=null;
function buildState(){
  const idToNo=Object.fromEntries(db.houses.map(h=>[h.id, h.houseNumber]));
  return {
    // Last state version this client loaded; the server rejects the save (409) if
    // another session has saved since, instead of silently clobbering it.
    baseVersion: db.stateVersion,
    settings:{ communityName:db.settings.communityName, address:db.settings.address, logo:db.settings.logo,
      promptPayQr:db.settings.promptPayQr,
      currency:db.rates.currency, waterRate:db.rates.waterRate, waterFixed:db.rates.waterFixed,
      gasRate:db.rates.gasRate, gasFixed:db.rates.gasFixed, formulaWater:db.formula.water, formulaGas:db.formula.gas,
      garbageFee:db.rates.garbageFee, serviceFee:db.rates.serviceFee },
    // Send the stable server id for existing houses so a rename is an in-place
    // update that keeps the house's readings (temp ids for new houses are omitted).
    houses: db.houses.map(h=>({ id:(/^\d+$/.test(h.id)?h.id:undefined), cluster:h.cluster, houseNumber:h.houseNumber, ownerName:h.ownerName,
      garbageFee:(h.garbageFee==null||h.garbageFee===''?null:h.garbageFee), serviceFee:(h.serviceFee==null||h.serviceFee===''?null:h.serviceFee) })),
    readings: db.readings.map(r=>({ houseNumber:idToNo[r.houseId]||r.houseNumber, period:r.period,
      waterPrev:r.waterPrev, waterCurr:r.waterCurr, gasPrev:r.gasPrev, gasCurr:r.gasCurr })),
  };
}
function save(){
  if(!session || session.role!=='admin') return;
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(async ()=>{
    try{ const d=await api('/api/admin/state',{method:'PUT',body:buildState()});
      if(d&&d.houses){ db.houses=d.houses.map(normHouse); db.readings=d.readings.map(normReading); applySettings(d.settings); }
    }catch(e){
      if(e.status===409 && e.data && e.data.houses){ // another session saved first — reload the latest instead of overwriting it
        db.houses=e.data.houses.map(normHouse); db.readings=e.data.readings.map(normReading); applySettings(e.data.settings);
        renderAdminBody();
        alert('Your latest change was not saved: another session updated the data. The current data has been reloaded — please re-apply your change.');
      } else { console.error('save failed',e); alert('Could not save to the server: '+e.message); }
    }
  }, 350);
}
// Branding (name/address/logo/PromptPay QR) saves via the dedicated, lightweight
// /branding endpoint — not the heavy whole-state sync — so large QR/logo images
// don't bloat (or exceed the size limit of) the state payload.
async function saveBranding(){
  if(!session || session.role!=='admin') return;
  const r=await api('/api/admin/branding',{method:'PUT',body:{
    communityName:db.settings.communityName, address:db.settings.address,
    logo:db.settings.logo ?? null, promptPayQr:db.settings.promptPayQr ?? null }});
  if(r) applySettings(r);
}

const ADMIN={user:'admin',pass:'admin123'};
function money(n){ return db.rates.currency+" "+Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}); }
function displayYear(y){ return lang==='th' ? (parseInt(y,10)+543) : parseInt(y,10); }  // Thai shows Buddhist Era (CE+543)
function periodLabel(p){ const [y,m]=p.split('-'); return MONTHS[lang][parseInt(m,10)-1]+" "+displayYear(y); }
function formatDate(d){
  try{
    if(lang==='th') return d.toLocaleDateString('th-TH-u-ca-buddhist',{day:'numeric',month:'short',year:'numeric'});
    if(lang==='zh') return d.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});
    return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  }catch(e){ return d.toISOString().slice(0,10); }
}
function houseByNumber(no){ return db.houses.find(h=>h.houseNumber.toLowerCase()===String(no).toLowerCase()); }
function houseById(id){ return db.houses.find(h=>h.id===id); }
const FVARS=['prev','curr','usage','rate','fixed','min','max','round','abs'];
function compileFormula(expr){
  if(typeof expr!=='string'||!expr.trim()) return null;
  let test=expr;
  FVARS.forEach(v=>{ test=test.replace(new RegExp('\\b'+v+'\\b','g'),' '); });
  if(/[^0-9.+\-*/()%,\s]/.test(test)) return null;   // only numbers & operators may remain
  try{
    const fn=new Function('prev','curr','usage','rate','fixed','min','max','round','abs','"use strict";return ('+expr+');');
    const probe=fn(100,120,20,18,30,Math.min,Math.max,Math.round,Math.abs);
    if(typeof probe!=='number'||!isFinite(probe)) return null;
    return fn;
  }catch(e){ return null; }
}
function evalFormula(expr,prev,curr,rate,fixed){
  const fn=compileFormula(expr); if(!fn) return NaN;
  try{ const v=fn(prev,curr,curr-prev,rate,fixed,Math.min,Math.max,Math.round,Math.abs); return (typeof v==='number'&&isFinite(v))?v:NaN; }catch(e){ return NaN; }
}
// Effective per-house fee: the house override if set (incl. 0), else the community default.
function effFee(houseVal, communityVal){ return (houseVal==null||houseVal==='')?(+communityVal||0):(+houseVal||0); }
function calcInvoice(r){
  const R=db.rates, F=db.formula||{};
  const wU=r.waterCurr-r.waterPrev, gU=r.gasCurr-r.gasPrev;
  let wC=evalFormula(F.water,r.waterPrev,r.waterCurr,R.waterRate,R.waterFixed);
  let gC=evalFormula(F.gas,r.gasPrev,r.gasCurr,R.gasRate,R.gasFixed);
  if(isNaN(wC)) wC=wU*R.waterRate+R.waterFixed;
  if(isNaN(gC)) gC=gU*R.gasRate+R.gasFixed;
  const h=houseById(r.houseId)||{};
  const r2=x=>Math.round((+x||0)*100)/100;
  const garbage=r2(effFee(h.garbageFee,R.garbageFee)), service=r2(effFee(h.serviceFee,R.serviceFee));
  return {wU,gU,wC,gC,garbage,service,total:wC+gC+garbage+service};
}

    };

}

function bindReadings(){
  const $=id=>document.getElementById(id);
  function autofill(){
    const hid=$('rHouse').value, per=$('rPeriod').value;
    const prior=db.readings.filter(r=>r.houseId===hid&&r.period<per).sort((a,b)=>b.period.localeCompare(a.period))[0];
    const exist=db.readings.find(r=>r.houseId===hid&&r.period===per);
    const carry=(cur,prv)=> (cur===0||cur==null||cur==='')? (prv??'') : cur;  // last month's current, else last month's previous
    if(exist){ $('wp').value=exist.waterPrev;$('wc').value=exist.waterCurr;$('gp').value=exist.gasPrev;$('gc').value=exist.gasCurr; }
    else { $('wp').value=prior?carry(prior.waterCurr,prior.waterPrev):''; $('gp').value=prior?carry(prior.gasCurr,prior.gasPrev):''; $('wc').value='';$('gc').value=''; }
    $('wpHint').textContent=prior?t('prevAuto'):''; $('gpHint').textContent=prior?t('prevAuto'):''; preview();
  }
  const curOrPrev=(curId,prv)=> ($(curId).value===''? prv : (+$(curId).value||0));  // blank current → equals previous (usage 0)
  function preview(){
    const wp=+$('wp').value||0, gp=+$('gp').value||0;
    const r={houseId:$('rHouse').value,waterPrev:wp,waterCurr:curOrPrev('wc',wp),gasPrev:gp,gasCurr:curOrPrev('gc',gp)};
    if($('wc').value===''&&$('gc').value===''){ $('calcPreview').innerHTML=''; return; }
    const c=calcInvoice(r);
    $('calcPreview').innerHTML=`<div class="stat-grid" style="margin-top:6px">
      <div class="stat"><div class="ico water">${svg('water')}</div><div class="l">${t('water')} · ${t('usage')} ${c.wU}</div><div class="v" style="font-size:18px">${money(c.wC)}</div></div>
      <div class="stat"><div class="ico gas">${svg('gas')}</div><div class="l">${t('gas')} · ${t('usage')} ${c.gU}</div><div class="v" style="font-size:18px">${money(c.gC)}</div></div>
      <div class="stat" style="background:var(--brand-soft);border-color:var(--brand-2)"><div class="ico brand">${svg('invoice')}</div><div class="l">${t('total')}</div><div class="v" style="font-size:20px;color:var(--brand-d)">${money(c.total)}</div></div></div>`;
  }
  $('rHouse').onchange=()=>{ rdHouse=$('rHouse').value; autofill(); }; $('rPeriod').onchange=autofill;
  ['wp','wc','gp','gc'].forEach(id=>$(id).addEventListener('input',preview));
  autofill();
  $('saveReading').onclick=()=>{
    const hid=$('rHouse').value, per=$('rPeriod').value;
    const wp=+$('wp').value||0,gp=+$('gp').value||0;
    const wc=curOrPrev('wc',wp), gc=curOrPrev('gc',gp);  // blank current → equals previous
    if(wc<wp||gc<gp){ $('rdmsg').innerHTML=`<div class="notice err">${t('currLessPrev')}</div>`; return; }
    curMonth=per; rdHouse=hid;  // remember selection so re-render keeps this house
    const ex=db.readings.find(r=>r.houseId===hid&&r.period===per);
    if(ex){ Object.assign(ex,{waterPrev:wp,waterCurr:wc,gasPrev:gp,gasCurr:gc}); }
    else db.readings.push({id:uid('r'),houseId:hid,period:per,waterPrev:wp,waterCurr:wc,gasPrev:gp,gasCurr:gc});
    save(db); renderAdminBody();
    setTimeout(()=>{const m=document.getElementById('rdmsg');if(m)m.innerHTML=`<div class="notice ok">${svg('shield','icn sm')} ${t('readingSaved')}</div>`;},0);
  };
}

function bindPayments(){
  const $=id=>document.getElementById(id);
  const pf=$('payF'); if(pf){pf.value=payFilter; pf.onchange=()=>{payFilter=pf.value;renderAdminBody();};}
  const ph=$('payHouse'); if(ph){ph.value=payHouse; ph.onchange=()=>{payHouse=ph.value;renderAdminBody();};}
  const ps=$('payS'); if(ps){ps.value=payStatus; ps.onchange=()=>{payStatus=ps.value;renderAdminBody();};}
  const msg=(cls,key)=>{ const m=$('paymsg'); if(m) m.innerHTML=`<div class="notice ${cls}">${t(key)}</div>`; };
  const setPaid=async (id,paid)=>{
    try{ const r=await api('/api/admin/readings/'+id+'/payment',{method:'POST',body:{paid}});
      const loc=db.readings.find(x=>x.id===String(id)); if(loc){loc.paid=!!r.paid; loc.paidAt=r.paid_at||null;}
      renderAdminBody(); setTimeout(()=>msg('ok',paid?'paidMsg':'unpaidMsg'),0);
    }catch(e){ alert(e.message); }
  };
  document.querySelectorAll('[data-paid]').forEach(b=>b.onclick=()=>setPaid(b.dataset.paid,true));
  document.querySelectorAll('[data-unpaid]').forEach(b=>b.onclick=()=>setPaid(b.dataset.unpaid,false));
  document.querySelectorAll('[data-proof]').forEach(b=>b.onclick=async ()=>{
    try{ const d=await api('/api/admin/readings/'+b.dataset.proof+'/proof'); if(d&&d.proof) openImageModal(d.proof,t('proofTitle')); }
    catch(e){ alert(e.message); }
  });
  const file=$('payProofFile');
  document.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{ file.dataset.rid=b.dataset.up; file.click(); });
  if(file) file.onchange=e=>{
    const f=e.target.files[0]; if(!f){return;} const id=file.dataset.rid;
    if(f.size>1.5*1024*1024){ msg('err','logoTooBig'); file.value=''; return; }
    const rd=new FileReader();
    rd.onload=async ()=>{ try{
        const r=await api('/api/admin/readings/'+id+'/payment',{method:'POST',body:{proof:rd.result,paid:true}});
        const loc=db.readings.find(x=>x.id===String(id)); if(loc){loc.paid=!!r.paid; loc.paidAt=r.paid_at||null; loc.hasProof=!!r.hasProof;}
        renderAdminBody(); setTimeout(()=>msg('ok','proofSaved'),0);
      }catch(err){ msg('err','logoTooBig'); } file.value=''; };
    rd.readAsDataURL(f);
  };
}

function bindSettings(){
  const $=id=>document.getElementById(id);
  const setMsg=(cls,key)=>{ const m=$('setmsg'); if(m) m.innerHTML=`<div class="notice ${cls}">${t(key)}</div>`; };
  $('logoBtn').onclick=()=>$('logoFile').click();
  $('logoFile').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    if(f.size>1.5*1024*1024){ setMsg('err','logoTooBig'); return; }
    const rd=new FileReader();
    rd.onload=async ()=>{ db.settings.logo=rd.result; try{ await saveBranding(); setFavicon(); renderAdminBody(); setTimeout(()=>setMsg('ok','brandingSaved'),0);}catch(err){ setMsg('err','logoTooBig'); } };
    rd.readAsDataURL(f);
  };
  if($('logoDel')) $('logoDel').onclick=async ()=>{ db.settings.logo=null; await saveBranding(); setFavicon(); renderAdminBody(); };
  $('ppBtn').onclick=()=>$('ppFile').click();
  $('ppFile').onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    if(f.size>1.5*1024*1024){ setMsg('err','logoTooBig'); return; }
    const rd=new FileReader();
    rd.onload=async ()=>{ db.settings.promptPayQr=rd.result; try{ await saveBranding(); renderAdminBody(); setTimeout(()=>setMsg('ok','ppSaved'),0);}catch(err){ setMsg('err','logoTooBig'); } };
    rd.readAsDataURL(f);
  };
  if($('ppDel')) $('ppDel').onclick=async ()=>{ db.settings.promptPayQr=null; await saveBranding(); renderAdminBody(); };
  $('saveSettings').onclick=async ()=>{ db.settings.communityName=$('cName').value.trim()||'MCTS'; db.settings.address=$('cAddr').value.trim();

    const sb=document.querySelector('.side-brand span'); if(sb)sb.textContent=db.settings.communityName;

  $('saveSecurity').onclick=async ()=>{
    const secMsg=(cls,key)=>{ const m=$('secmsg'); if(m) m.innerHTML=`<div class="notice ${cls}">${t(key)}</div>`; };
    const clamp=(v,lo,hi,d)=>{ const n=Math.floor(Number(v)); return Number.isFinite(n)?Math.min(hi,Math.max(lo,n)):d; };
    const maxLoginAttempts=clamp($('maxAtt').value,1,100,5), lockoutMinutes=clamp($('lockMin').value,1,1440,15);

      if(r) applySettings(r); renderAdminBody(); setTimeout(()=>{ secMsg('ok','securitySaved'); loadLocked(); },0);
    }catch(err){ secMsg('err','saveFailed'); }

  // Locked-out devices: list + per-device and bulk unlock.

    const box=$('lockedBox'); if(!box) return;

    if(!list.length){ box.innerHTML=`<p class="help" style="margin:0">${t('noLocked')}</p>`; return; }
    const rows=list.map(l=>{ const mins=Math.max(1,Math.ceil(l.retryAfter/60));
      return `<div class="rowflex" style="align-items:center;gap:10px;margin-top:8px">
        <div style="flex:1;min-width:160px"><strong>${esc(l.ip)}</strong> <span class="pill warn">${esc(l.scope)}</span>
          <span class="help" style="display:inline;margin-left:6px">${t('unlocksIn')} ~${mins} ${t('minShort')}</span></div>
        <button class="btn ghost sm" data-unlock="${esc(l.key)}">${svg('shield','icn sm')} ${t('unlock')}</button>
      </div>`; }).join('');
    box.innerHTML=`<label style="margin:0 0 4px">${t('lockedNow')} (${list.length})</label>${rows}
      <button class="btn danger sm" id="unlockAll" style="margin-top:12px">${t('unlockAll')}</button>`;
    box.querySelectorAll('[data-unlock]').forEach(btn=>btn.onclick=async()=>{
      try{ await api('/api/admin/security/unlock',{method:'POST',body:{key:btn.getAttribute('data-unlock')}}); }catch(e){}
      loadLocked();
    });
    const ua=$('unlockAll'); if(ua) ua.onclick=async()=>{
      try{ await api('/api/admin/security/unlock',{method:'POST',body:{all:true}}); }catch(e){}
      loadLocked();
    };
  }
  loadLocked();
}

        <td class="colcheck">${cb}</td><td><strong>${lab}</strong></td><td>${c.wU}</td><td>${c.gU}</td><td class="right nowrap">${totalCell}</td></tr>`;}).join('');
    body=`<div class="card">

        <div style="flex:none;display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn primary" id="ownPay">${svg('rates','icn sm')} ${t('pay')} <span id="ownPayN"></span></button>

        <tbody id="ownRows">${rowsHtml}<tr id="ownNoRes" class="hidden"><td colspan="5"><div class="empty"><div class="ei">${svg('search')}</div>${t('noResults')}</div></td></tr></tbody></table></div>

function bindOwner(){
  bindLang();
  ['logoutBtnM','logoutBtnT'].forEach(id=>{const e=document.getElementById(id);if(e)e.onclick=doLogout;});
  const rows=document.getElementById('ownRows'); if(!rows)return;
  document.querySelectorAll('.own-row').forEach(tr=>tr.onclick=()=>{
    ownerPeriod=tr.dataset.p;
    document.querySelectorAll('.own-row').forEach(x=>x.classList.toggle('active',x===tr));
    drawInvoice();
  });
  const h=houseByNumber(session.houseNumber);
  const byP=Object.fromEntries((h?db.readings.filter(r=>r.houseId===h.id):[]).map(r=>[r.period,r]));
  const oall=document.getElementById('ownAll');
  const osels=()=>Array.from(document.querySelectorAll('.own-sel'));
  const visSels=()=>osels().filter(c=>!c.closest('tr').classList.contains('hidden'));
  const updON=()=>{ const n=osels().filter(c=>c.checked).length;
    const dn=document.getElementById('ownDlN'); if(dn)dn.textContent=n?`(${n})`:'';
    const pn=document.getElementById('ownPayN'); if(pn)pn.textContent=n?`(${n})`:'';
    if(oall){const tot=visSels().length; const cn=visSels().filter(c=>c.checked).length; oall.checked=tot>0&&cn===tot; oall.indeterminate=cn>0&&cn<tot;} };
  if(oall) oall.onchange=()=>{ visSels().forEach(c=>c.checked=oall.checked); updON(); };
  osels().forEach(c=>c.onchange=updON);
  // Year + Month dropdown filter.
  const ySel=document.getElementById('ownYear'), mSel=document.getElementById('ownMonth');
  const applyFilter=()=>{
    ownerYear=ySel?ySel.value:'all'; ownerMonth=mSel?mSel.value:'all';
    let shown=0;
    document.querySelectorAll('.own-row').forEach(tr=>{
      const [py,pm]=tr.dataset.p.split('-');
      const match=(ownerYear==='all'||py===ownerYear)&&(ownerMonth==='all'||pm===ownerMonth);
      tr.classList.toggle('hidden',!match); if(match)shown++;
      if(!match){ const cb=tr.querySelector('.own-sel'); if(cb)cb.checked=false; }
    });
    const nr=document.getElementById('ownNoRes'); if(nr) nr.classList.toggle('hidden',shown>0);
    updON();
  };
  if(ySel) ySel.onchange=applyFilter;
  if(mSel) mSel.onchange=applyFilter;
  applyFilter();
  // Download selected (or all visible if none selected).
  const odl=document.getElementById('ownDl');
  if(odl) odl.onclick=()=>{
    let ps=osels().filter(c=>c.checked).map(c=>c.value);
    if(!ps.length) ps=visSels().map(c=>c.value);
    if(!ps.length) return;
    downloadInvoicesPDF(ps.sort().reverse().map(p=>byP[p]));
  };
  // Pay selected month(s) (or the active month if none selected).
  const paidSet=new Set((h?db.readings.filter(r=>r.houseId===h.id&&r.paid):[]).map(r=>r.period));
  const opay=document.getElementById('ownPay');
  if(opay) opay.onclick=()=>{
    let ps=osels().filter(c=>c.checked).map(c=>c.value);
    if(!ps.length && ownerPeriod) ps=[ownerPeriod];
    ps=ps.filter(p=>!paidSet.has(p));   // paid months can't be paid again
    if(!ps.length){ alert(t('selectMonthsFirst')); return; }
    openPayModal(ps.sort().reverse());
  };
  updON();
  drawInvoice();
}
function drawInvoice(){
  const area=document.getElementById('invoiceArea'); if(!area)return;
  const h=houseByNumber(session.houseNumber);
  const r=db.readings.find(x=>x.houseId===h.id&&x.period===ownerPeriod);
  if(!r){ area.innerHTML=`<div class="empty"><div class="ei">${svg('invoice')}</div>${t('noInvoiceP')}</div>`; return; }
  const c=calcInvoice(r), R=db.rates;
  area.innerHTML=`<div class="invoice">
    <div class="inv-head">
      <div><div class="lbl">${t('invoiceFor')} · ${esc(h.houseNumber)}</div><div class="big">${periodLabel(ownerPeriod)}</div></div>
      <div style="text-align:right"><div class="lbl">${t('grandTotal')}</div><div class="tot">${money(c.total)}</div>
        ${r.paid?`<div class="lbl" style="margin-top:4px;color:#fff;font-weight:700;display:flex;align-items:center;gap:6px;justify-content:flex-end">${svg('approve','icn sm')} ${t('paid')}</div>`:''}
        <div style="margin-top:10px;display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
        ${r.paid
          ? (r.hasProof?`<button id="rcptBtn" style="background:#fff;color:var(--brand-d);border:1px solid #fff;padding:7px 14px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px">${svg('doc','icn sm')} ${t('viewReceipt')}</button>`:'')
          : `<button id="payBtn" style="background:#fff;color:var(--brand-d);border:1px solid #fff;padding:7px 14px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px">${svg('rates','icn sm')} ${t('pay')}</button>`}
        <button id="stmtDl" style="background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.4);padding:7px 13px;border-radius:9px;font-weight:600;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px">${svg('doc','icn sm')} ${t('download')}</button>
        </div>
      </div>
    </div>
    <div class="inv-body">
      <div class="tbl-wrap" style="border:none">
      <table style="min-width:0"><thead><tr><th>${t('item')}</th><th class="right">${t('prev')}</th><th class="right">${t('curr')}</th><th class="right">${t('usage')}</th><th class="right">${t('rate')}</th><th class="right">${t('amount')}</th></tr></thead>
      <tbody>
        <tr><td><div class="util-cell"><span class="util-dot ico water">${svg('water','icn sm')}</span>${t('water')}</div></td><td class="right">${r.waterPrev}</td><td class="right">${r.waterCurr}</td><td class="right">${c.wU}</td><td class="right muted">×${R.waterRate}+${R.waterFixed}</td><td class="right"><strong>${money(c.wC)}</strong></td></tr>
        <tr><td><div class="util-cell"><span class="util-dot ico gas">${svg('gas','icn sm')}</span>${t('gas')}</div></td><td class="right">${r.gasPrev}</td><td class="right">${r.gasCurr}</td><td class="right">${c.gU}</td><td class="right muted">×${R.gasRate}+${R.gasFixed}</td><td class="right"><strong>${money(c.gC)}</strong></td></tr>
        ${c.garbage?`<tr><td colspan="5">${t('garbageFee')}</td><td class="right"><strong>${money(c.garbage)}</strong></td></tr>`:''}
        ${c.service?`<tr><td colspan="5">${t('serviceFee')}</td><td class="right"><strong>${money(c.service)}</strong></td></tr>`:''}
      </tbody>
      <tfoot><tr><td colspan="5" class="right">${t('grandTotal')}</td><td class="right" style="color:var(--brand-d);font-size:16px">${money(c.total)}</td></tr></tfoot>
      </table></div>
    </div>
    <div class="inv-foot-note">${t('thanks')}</div>
  </div>`;
  const b=document.getElementById('stmtDl'); if(b) b.onclick=()=>downloadInvoicesPDF([r]);
  const pb=document.getElementById('payBtn'); if(pb) pb.onclick=()=>openPayModal([ownerPeriod]);
  const rb=document.getElementById('rcptBtn'); if(rb) rb.onclick=async ()=>{
    try{ const d=await api('/api/owner/readings/'+r.id+'/proof'); if(d&&d.proof) openImageModal(d.proof,t('viewReceipt')); }
    catch(e){ alert(e.message); }
  };
}

/* PromptPay payment modal: shows the uploaded QR and the total for the chosen month(s). */
function openPayModal(periods){
  periods=(Array.isArray(periods)?periods:[periods]).filter(Boolean);
  const h=houseByNumber(session.houseNumber);
  const items=periods.map(p=>{ const r=db.readings.find(x=>x.houseId===h.id&&x.period===p); return r?{p,total:calcInvoice(r).total}:null; }).filter(Boolean);
  if(!items.length) return;
  const total=items.reduce((s,i)=>s+i.total,0);
  const qr=(db.settings||{}).promptPayQr||null;
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(8,12,20,.62);backdrop-filter:blur(2px);display:grid;place-items:center;z-index:1000;padding:18px';
  const monthsList = items.length===1
    ? `<div style="margin-top:6px;color:var(--muted)">${t('payFor')} ${esc(periodLabel(items[0].p))}</div>`
    : `<div style="margin-top:8px"><div class="lbl" style="margin-bottom:4px">${t('payFor')} · ${items.length} ${t('selectedCount')}</div>
        <div style="max-height:120px;overflow:auto;border:1px solid var(--line);border-radius:10px">${items.map(i=>`<div style="display:flex;justify-content:space-between;padding:6px 11px;border-bottom:1px solid var(--line)"><span>${esc(periodLabel(i.p))}</span><span class="muted">${money(i.total)}</span></div>`).join('')}</div></div>`;
  const inner=qr
    ? `<div style="margin:14px 0;display:grid;place-items:center"><img src="${qr}" alt="PromptPay QR" style="max-width:280px;max-height:280px;width:100%;border-radius:14px;border:1px solid var(--line)"></div>
       <p class="help" style="text-align:center;margin:0 0 4px">${t('scanToPay')}</p>`
    : `<div class="notice info" style="margin:14px 0">${t('noQrOwner')}</div>`;
  ov.innerHTML=`<div style="background:var(--panel,#fff);border-radius:18px;max-width:360px;width:100%;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.4)">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
      <h3 style="margin:0">${t('payTitle')}</h3>
      <button id="payClose" class="btn ghost sm" aria-label="${t('close')}">✕</button>
    </div>
    ${monthsList}
    <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:baseline;background:var(--brand-soft);border:1px solid var(--brand-2);border-radius:12px;padding:12px 14px">
      <span class="lbl">${t('amountDue')}</span><b style="font-size:22px;color:var(--brand-d)">${money(total)}</b>
    </div>
    ${inner}
    <button id="payClose2" class="btn" style="width:100%;margin-top:6px">${t('close')}</button>
  </div>`;
  const close=()=>ov.remove();
  ov.addEventListener('click',e=>{ if(e.target===ov) close(); });
  document.body.appendChild(ov);
  ov.querySelector('#payClose').onclick=close;
  ov.querySelector('#payClose2').onclick=close;
}

/* ===================== PDF EXPORT ===================== */
function filteredInvoiceReadings(){
  return db.readings
    .filter(r=>(invFilter==='all'||r.period===invFilter) && (invHouse==='all'||r.houseId===invHouse))
    .sort((a,b)=>b.period.localeCompare(a.period));
}
function invoiceNo(r, util){
  const n = util==='gas' ? r.gasNo : r.waterNo;   // server-assigned running number
  return n!=null ? String(n).padStart(3,'0') : '—';
}
const PRINT_CSS=`<style>

body{font-family:'Inter','Noto Sans Thai','Noto Sans SC',system-ui,sans-serif;color:#101828;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}

.sl-line u{flex:1;min-width:110px;border-bottom:1px dotted #98a2b3;text-decoration:none;font-weight:600;padding:0 4px 2px;color:#101828}
.sl-tbl{width:100%;border-collapse:collapse;font-size:13.5px;border:1px solid #e7ebf1;border-radius:10px;overflow:hidden;margin-top:4px}
.sl-tbl td{padding:10px 14px;border-bottom:1px solid #eef1f5}
.sl-tbl tr:last-child td{border-bottom:none}
.sl-tbl td:first-child{font-weight:600;color:#344054}
.sl-tbl .r{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;width:110px}

.sl-total{display:flex;justify-content:space-between;align-items:center;margin-top:13px;padding:12px 16px;background:var(--accent);color:#fff;border-radius:10px}

.sl-foot{display:flex;justify-content:space-between;gap:28px;margin-top:30px}

function statementInner(r, util){
  const h=houseById(r.houseId)||{houseNumber:'',cluster:'',ownerName:''};
  const c=calcInvoice(r), R=db.rates, s=db.settings||{};
  const U = util==='gas'
    ? {prev:r.gasPrev,curr:r.gasCurr,usage:c.gU,charge:c.gC,title:t('billGas'),accent:'#ea6c10'}
    : {prev:r.waterPrev,curr:r.waterCurr,usage:c.wU,charge:c.wC,title:t('billWater'),accent:'#0a8fc7'};
  const logo = s.logo ? `<img src="${s.logo}" alt="">` : DEFAULT_LOGO;
  const num = n => Number(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  // Flat monthly fees ride on the water slip so the water+gas slips sum to the month's payable.
  const slipFees = util!=='gas';
  const slipTotal = U.charge + (slipFees ? (c.garbage + c.service) : 0);
  return `<div class="slip" style="--accent:${U.accent}">
    <div class="sl-head">
      <div class="sl-brand"><div class="sl-logo">${logo}</div>
        <div><div class="sl-name">${brandName()}</div>${s.address?`<div class="sl-addr">${esc(s.address)}</div>`:''}<div class="sl-title">${U.title}</div></div></div>
      <div class="sl-no"><span>${t('invNo')}</span><b>${invoiceNo(r,util)}</b></div>
    </div>
    <div class="sl-party">
      <div class="sl-line"><span>${t('nameLabel')}</span><u>${h.ownerName?esc(h.ownerName):''}</u></div>
      <div class="sl-pair">
        <div class="sl-line"><span>${t('houseNo')}</span><u>${esc(h.houseNumber)}${h.cluster?' · '+esc(h.cluster):''}</u></div>
        <div class="sl-line"><span>${t('period')}</span><u>${periodLabel(r.period)}</u></div>
      </div>
    </div>
    <table class="sl-tbl">
      <tr><td>${t('meterCurr')}</td><td class="r">${U.curr}</td><td class="u">${t('unitsWord')}</td></tr>
      <tr><td>${t('meterPrev')}</td><td class="r">${U.prev}</td><td class="u">${t('unitsWord')}</td></tr>
      <tr><td>${t('unitsUsed')}</td><td class="r">${U.usage}</td><td class="u">${t('unitsWord')}</td></tr>
      <tr><td>${t('serviceCharge')}</td><td class="r">${num(U.charge)}</td><td class="u">${esc(R.currency)}</td></tr>
      ${slipFees?(c.garbage?`<tr><td>${t('garbageFee')}</td><td class="r">${num(c.garbage)}</td><td class="u">${esc(R.currency)}</td></tr>`:''):''}
      ${slipFees?(c.service?`<tr><td>${t('serviceFee')}</td><td class="r">${num(c.service)}</td><td class="u">${esc(R.currency)}</td></tr>`:''):''}
    </table>
    <div class="sl-total"><span>${t('amountDue')}</span><b>${money(slipTotal)}</b></div>
    <div class="sl-foot">
      <div class="sl-sign"><span>${t('receivedBy')}</span><u></u></div>
      <div class="sl-sign"><span>${t('dateLabel')}</span><u>${formatDate(new Date())}</u></div>
    </div>
  </div>`;
}
function pdfFileName(list){
  const san=s=>String(s||'').replace(/[^A-Za-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'');
  if(list.length===1){ const r=list[0]; const h=houseById(r.houseId)||{}; const [y,m]=r.period.split('-'); return `${san(h.houseNumber)||'house'}_${m}_${y}`; }
  if(list.every(r=>r.houseId===list[0].houseId)){ const h=houseById(list[0].houseId)||{}; return `${san(h.houseNumber)||'house'}_invoices`; }
  return `${san((db.settings&&db.settings.communityName)||'MCTS')}_invoices`;
}
function downloadInvoicesPDF(readings){
  const list=(readings||[]).filter(Boolean);
  if(!list.length) return;
  const fn=pdfFileName(list);
  const fonts='<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=Noto+Sans+Thai:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">';
  const slips=[];
  list.forEach(r=>{ slips.push(statementInner(r,'water')); slips.push(statementInner(r,'gas')); });
  const pages=slips.map((html,i)=>`<div${i<slips.length-1?' style="page-break-after:always"':''}>`+html+`</div>`).join('');
  const doc='<!doctype html><html lang="'+lang+'"><head><meta charset="utf-8"><title>'+fn+'</title>'+fonts+PRINT_CSS+'</head><body>'+pages+'</body></html>';
  // Print through a hidden iframe — no extra browser tab/window, no about:blank, no popup blocker.
  const ifr=document.createElement('iframe');
  ifr.setAttribute('aria-hidden','true');
  ifr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  let done=false;
  const cleanup=()=>{ if(done)return; done=true; setTimeout(()=>{ try{ifr.remove();}catch(e){} },200); };
  ifr.onload=()=>{
    const w=ifr.contentWindow;
    const go=()=>{ try{ w.focus(); w.print(); }catch(e){} };
    if(w.onafterprint!==undefined) w.onafterprint=cleanup;
    // Wait for embedded fonts (Thai/Chinese) to load so the slip renders correctly.
    if(w.document.fonts&&w.document.fonts.ready){ w.document.fonts.ready.then(()=>setTimeout(go,150)); }
    else setTimeout(go,500);
    setTimeout(cleanup,60000); // safety net if onafterprint never fires
  };
  ifr.srcdoc=doc;
  document.body.appendChild(ifr);
}

/* ===================== Boot ===================== */
(async function boot(){
  await loadBranding();
  if(session && session.token){
    try{ if(session.role==='admin') await loadAdmin(); else await loadOwner(); }
    catch(e){ setSession(null); }
  }
  render();
})();
