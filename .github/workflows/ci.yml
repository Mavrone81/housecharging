name: CI

# Lock in the security/auth work: run the integration suite and a dependency
# audit on every push and PR. The integration test uses pg-mem (in-memory
# Postgres), so no database service is needed.
on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: housecharging-server

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: housecharging-server/package-lock.json
      - run: npm ci
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: housecharging-server/package-lock.json
      - run: npm ci
      # Fail the build on a known vulnerability in a production dependency
      # (VAPT recommendation 13: periodic npm audit).
      - run: npm audit --omit=dev --audit-level=high
